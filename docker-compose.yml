version: '3.3'

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-admin123}
      MARIADB_DATABASE: ReconocimientoFacialProd
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql://root:${DB_PASSWORD:-admin123}@db:3306/ReconocimientoFacialProd
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-super-secret-key-for-jwt-change-me}
      - KIOSK_API_KEY=${KIOSK_API_KEY:-kiosk-secret-key-123}
      - DISABLE_AUTH=${DISABLE_AUTH:-true}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin123}
    ports:
      - "4000:4000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
