version: '3.8'

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-admin123}
      MARIADB_DATABASE: ${DB_NAME:-u493510526_reconfpain_db}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql://root:${DB_PASSWORD:-admin123}@db:3306/${DB_NAME:-u493510526_reconfpain_db}?connection_limit=10
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-super-secret-key-for-jwt-32bytes}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-12345678901234567890123456789012}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    ports:
      - "4000:4000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
